services:
  airflow:
    # Image construite à partir du Dockerfile de ce dossier
    build: .
    # Tout Airflow dans un seul conteneur : pratique en local, pas en production
    command: standalone
    # Interface sur http://localhost:8080
    ports:
      - "8080:8080"
    environment:
      # Pas de DAGs d'exemple
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # En local, pas de mot de passe : tout le monde est administrateur
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      # Le dossier des DAGs est relu toutes les 30 secondes
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    volumes:
      # Nos DAGs, lus par Airflow
      - ./dags:/opt/airflow/dags
      # Socket Docker : Airflow lance les conteneurs des jobs sur le Docker de la machine
      - /var/run/docker.sock:/var/run/docker.sock
    # Linux uniquement : donner accès au socket Docker (GID affiché par `stat -c %g /var/run/docker.sock`)
    # group_add:
    #   - "984"
